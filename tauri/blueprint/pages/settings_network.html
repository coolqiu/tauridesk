<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/industrial.css">
    <style>
        .net-row { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-light); cursor: pointer; }
        .net-row:last-child { border-bottom: none; }
        .net-icon { width: 24px; height: 24px; color: var(--accent); margin-right: 15px; }
        .net-label { flex: 1; font-size: 15px; color: var(--text-main); }
        .net-arrow { color: #BBB; font-size: 18px; }
        
        .toggle-switch { width: 40px; height: 20px; background: #CCC; border-radius: 10px; position: relative; cursor: pointer; }
        .toggle-switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; }
    </style>
</head>
<body style="background:transparent">
    <div class="content">
        <!-- 置顶解锁按钮 -->
        <div style="width: 540px;">
            <button class="btn-blue" style="width: 100%; justify-content: center; margin-bottom: 20px;">🛡️ 解锁网络设置</button>
        </div>

        <div class="card">
            <div class="card-title">网络</div>
            
            <!-- ID/中继服务器 -->
            <div class="net-row">
                <svg class="net-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="6" rx="1"/><rect x="2" y="13" width="20" height="6" rx="1"/><circle cx="5" cy="8" r="1"/><circle cx="5" cy="16" r="1"/></svg>
                <div class="net-label">ID/中继服务器</div>
                <div class="net-arrow">❯</div>
            </div>

            <!-- 代理设置 -->
            <div class="net-row">
                <svg class="net-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7h-9m0 0l3-3m-3 3l3 3M4 17h9m0 0l-3-3m3 3l-3 3"/></svg>
                <div class="net-label">Socks5/Http(s) 代理</div>
                <div class="net-arrow">❯</div>
            </div>

            <!-- WebSocket -->
            <div class="net-row" style="cursor: default;">
                <svg class="net-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8"/></svg>
                <div class="net-label">使用 WebSocket <span style="font-size:13px; opacity:0.3; cursor:help">?</span></div>
                <div class="toggle-switch"></div>
            </div>
        </div>
    </div>
</body>
</html>
